<style>
:root{--bg:#f5f0e7;--paper:#fffdf9;--ink:#312d28;--muted:#756d64;--accent:#9a5b3d;--soft:#ead8c7;--line:#e6ddd1;--shadow:0 10px 28px rgba(60,45,30,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(135deg,#fffaf1,#eee0d0);border-bottom:1px solid var(--line)}.hero{max-width:1180px;margin:auto;padding:38px 22px 26px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:var(--accent)}h1,h2,h3{font-family:Georgia,serif}.hero h1{font-size:44px;margin:7px 0}.sub{color:var(--muted);margin:0 0 22px}.search{width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fff;outline:0}.search:focus{border-color:var(--accent)}main{max-width:1180px;margin:auto;padding:24px 22px 55px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters button,.back{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 13px;color:var(--ink);cursor:pointer}.filters button.active,.filters button:hover,.back:hover{background:var(--accent);border-color:var(--accent);color:#fff}.count{font-size:13px;color:var(--muted);margin:8px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-2px)}.cat{color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.11em}.card h2{font-size:23px;margin:8px 0}.preview{color:var(--muted);line-height:1.5;font-size:14px}.tag{display:inline-block;background:#f0e4d8;border-radius:999px;padding:4px 8px;font-size:11px;margin:12px 4px 0 0}.recipe{display:none;max-width:920px;margin:auto}.recipe.show{display:block}.back{margin-bottom:18px}.recipe-title h1{font-size:42px;margin:8px 0}.meta{color:var(--muted);margin-bottom:25px}.body{display:grid;grid-template-columns:290px 1fr;gap:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:21px}.panel h3{margin-top:0;font-size:22px}.ing{padding:9px 0;border-bottom:1px solid var(--line)}.ing:last-child{border-bottom:0}.intro{color:var(--muted);line-height:1.65;margin-bottom:20px}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;margin:0 0 18px}.num{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800}.steptext{line-height:1.65}.subheading{font-family:Georgia,serif;font-size:19px;font-weight:700;margin:24px 0 12px;color:var(--accent)}a{color:var(--accent)}.empty{text-align:center;color:var(--muted);padding:50px}.url{word-break:break-all}@media(max-width:720px){.hero h1,.recipe-title h1{font-size:33px}.body{grid-template-columns:1fr}}
</style></head><body><header><div class="hero"><div class="eyebrow">Recetario personal</div><h1>Comida</h1><p class="sub">Tus recetas, ordenadas y listas para consultar.</p><input class="search" id="search" placeholder="Buscar receta, ingrediente o preparación…"></div></header><main><section id="listing"><div class="filters" id="filters"></div><div class="count" id="count"></div><div class="grid" id="grid"></div></section><section id="recipe" class="recipe"></section></main><script>const RECIPES=[{"name": "Albondigas de merluza en salsa verde", "category": "Pescado y marisco", "tags": [], "ingredients": [], "steps": [], "intro": ["- Ingredientes: 500 g de merluza, 1 Huevo, 100 ml de Leche, 100 g de Miga de pan, Harina de trigo, Aceite de oliva virgen extra, 1 Diente de ajo, Perejil al gusto, 50 ml de Vino de Jerez, 1 cebolla, 500 ml de Caldo de pescado o fumet y Sal y pimienta al gusto", "- Elaboración: Para formar nuestras albóndigas, cortamos el pescado en tiras y éstas en cuadraditos, picando como si hiciéramos carne picada con la merluza. La colocamos en un bol junto al perejil picado, 1 diente de ajo, la miga de pan remojada con la leche y el huevo, trabajando hasta formar una masa. Formamos unas bolas con la masa, las pasamos por harina y las freímos hasta dorarlas levemente en una sartén con aceite de oliva. Escurrimos las bolas en papel absorbente para retirar el exceso de aceite y las reservamos. Preparamos una salsa picando una cebolla en trozos muy pequeños y los pochamos en aceite de oliva hasta que se ablanden. Añadimos dos dientes de ajo picados y un poco de perejil y lo removemos con la cebolla durante dos minutos. Añadimos el vino de Jerez y dejamos que evapore. Incorporamos 500 ml de caldo de pescado y bajamos el fuego, dejando que se cocine durante 10 minutos. Metemos las albóndigas en el caldo, teniendo en cuenta que el nivel inicial de caldo no debe superar la mitad de su altura y dejamos que se haga el conjunto, dando un suave hervor durante cinco minutos. Tras espolvorear con un poco más de perejil picado, las tenemos listas para servir."]}, {"name": "Alubias pintas con verduras", "category": "Legumbres y cereales", "tags": [], "ingredients": ["400 g de alubias pintas", "2 zanahorias", "½ cebolla", "½ pimiento verde", "5 dientes de ajo", "Aceite de oliva virgen extra", "Pimentón dulce de La Vera", "Sal"], "steps": [], "intro": ["Las legumbres podemos hacerlas en cazuela poco a poco si disponemos de tiempo pero hay veces que la olla exprés nos facilita la tarea. También depende de la legumbre y, es cierto que las alubias son de esas legumbres que solemos hacer con tiempo de forma más tradicional. Dentro de las variedades de alubias, la pintas son de las más agradecidas y en olla exprés quedan estupendamente por ser mantecosas y de piel más fina.", "Lo primero que hay que hacer es hidratar bien las alubias. Para ello conviene dejarlas en agua (fría) desde la noche anterior. Por lo menos que estén en remojo unas 12 horas. En el momento que vayamos a hacer las alubias pintas con verduras aclaramos las alubias y las tendremos listas para ponerlas en la olla.", "1- En la olla ponemos las alubias junto con las verduras y los ajos en camisa. Se cubre todo con agua fría (del tiempo), se echa una cucharadita de sal y se cierra la olla.", "2- Se pone al fuego y cuando suba la válvula se deja el tiempo marcado por el fabricante. En el caso de esta olla son 15-20 minutos.", "3- Cuando termine se abre la olla, se añade un refrito de ajos con dos cucharadas de aceite de oliva virgen extra y una cucharada de pimentón dulce de La Vera. Se deja cocer 5 minutos más para que se mezcle bien y estará listo. Se dejan reposar un poco y se sirven en plato hondo. Se pueden acompañar de algún encurtido como piparras o pepinillos en vinagre"]}, {"name": "Burguer de berenjena", "category": "Ensaladas y verduras", "tags": [], "ingredients": ["1 berenjena grande", "Media cebolla grande", "2 dientes de ajo", "1 zanahoria", "1 huevo", "90 g de harina de avena", "Aceite de oliva virgen extra", "Pimienta negra", "Sal"], "steps": [], "intro": ["1- El primer paso para elaborar las hamburguesas de berenjena será dejar listas todas las verduras. Para ello, las lavamos bien bajo un chorro de agua fría, pelamos la berenjena y la cortamos en trozos pequeños. Hacemos lo mismo con el resto de verduras: la zanahoria, la cebolla y el ajo, bien picadito.", "2- Una vez listos todos los ingredientes, los pochamos en una sartén con AOVE, sal y pimienta durante unos 10-15 minutos. Es importante que el fuego no esté muy fuerte, ya que queremos que las verduras nos queden muy tiernas para después formar las hamburguesas.", "3- Una vez cocinadas, las escurrimos en un colador para quitarle el exceso de agua y aceite y las pasamos a un bol. Agregamos el huevo, la harina y vamos removiendo poco a poco hasta que obtengamos una masa homogénea y consistente. Si vemos que está demasiado líquida, vamos añadiendo poco a poco más cantidad de harina, la que admita.", "4- Antes de cocinarlas, tapamos el recipiente con papel transparente y lo dejamos reposar en la nevera durante unos 15 minutos. Al estar frías, la masa estará más consistente y nos resultará más fácil manejarlas.", "5- Una vez pasado este tiempo, lo sacamos y vamos formando las hamburguesas. Con esta cantidad de masa, puedes hacer cuatro hamburguesas grandes -como en nuestro caso- o seis más pequeñas."]}, {"name": "Burguer de lentejas", "category": "Legumbres y cereales", "tags": [], "ingredients": ["180 g de lentejas pardinas secas (o 450 g de lentejas cocidas)", "Sal", "1 cebolla", "1 diente de ajo", "1 zanahoria", "100 g de champiñones", "Aceite de oliva virgen extra", "3 cucharadas de tomate triturado", "1 cucharadita de comino molido", "1 cucharadita de pimentón dulce", "½ cucharadita de pimienta molida", "2 cucharadas de copos de avena", "1 cucharada de semillas de lino", "1 ramillete de perejil fresco"], "steps": [], "intro": ["https://www.bonviveur.es/recetas/hamburguesas-de-lentejas", "- Tiempo de preparación: 50 minutos", "- Tiempo de cocinado: 10 minutos", "- Tiempo total: 1 hora (más 2 horas de reposo)", "- Raciones: 3, 6 piezas de 100 g", "Si las lentejas con crudas: cocemos las  lentejas en abundante agua con sal, a fuego medio, durante 30 minutos.", "1- Para ello, pelamos y picamos muy finamente 1 cebolla, 1 diente de ajo, 1 zanahoria y 100 g de champiñones.", "2- Sofreímos el ajo y la cebolla con aceite de oliva virgen extra durante 5 minutos, hasta que comiencen a transparentarse.", "3- Agregamos la zanahoria y los champiñones y sofreímos otros 5 minutos a fuego medio.", "4- Añadimos 3 cucharadas de tomate triturado, 1 cucharadita de comino molido, 1 cucharadita de pimentón dulce, ½ cucharadita de pimienta molida y sal al gusto. Bajamos el fuego al mínimo y cocinamos durante 5 minutos más.", "5- Cuando las lentejas estén cocidas, las escurrimos bien y las trituramos ligeramente, sin llegar a hacerlas puré, de forma que quede una pasta con algunas lentejas enteras. Podemos también machacarlas con un tenedor hasta obtener esta textura.", "6- Con ayuda de un molinillo o procesador de alimentos, molemos 2 cucharadas de copos de avena y 1 cucharada de semillas de lino hasta reducirlas a polvo.", "7- En un bol, mezclamos muy bien las lentejas con el sofrito, la avena y el lino molidos, y 1 ramillete de perejil fresco picado.", "8- Dejamos enfriar la mezcla y la guardamos en la nevera durante 2 horas, así será más fácil de moldear."]}, {"name": "Ceviche de dorada", "category": "Pescado y marisco", "tags": [], "ingredients": ["Ingredientes: 4 filetes de dorada, 1 cebolleta mediana, 2 ajos, 4 limas y 1 manojo de cilantro/perejil."], "steps": [], "intro": ["- Ingredientes: 4 filetes de dorada, 1 cebolleta mediana, 2 ajos, 4 limas y 1 manojo de cilantro/perejil.", "- Elaboración: Empezamos quitando la piel a las doradas. Cortamos un poco con un cuchillo afilado la cola de la dorada con una incisión en diagonal y sin cortar la piel. Ponemos el cuchillo paralelo a la tabla y movemos el cuchillo para separar la carne del pescado de la piel. Después sacamos la zona central que tendrá unas pequeñas espinas. Cortamos la dorada en pequeñas tiras y la ponemos a macerar en un bol con el resto de ingredientes: el zumo de las limas, el cilantro picado, la cebolleta y los ajos picados. Dejaremos unos 30 minutos en frio como mínimo. Sacamos y servimos."]}, {"name": "Cherrys asados (acompañamiento o picoteo)", "category": "Ensaladas y verduras", "tags": [], "ingredients": ["250gr de tomates cherry", "3 dientes de ajo laminados", "Ralladura de un limón", "1 cucharadita de especias mediterráneas", "1 cucharadita de orégano", "4-5. cucharadas de Aceite de oliva", "Sofreir el ajo", "Echar los cherry y dorarlos y tapar unos minutos", "Añadir la ralladura de limón y las especias y darle unas vueltecitas haciendo chof-chof"], "steps": [], "intro": ["Feedback: muy bueno y rápido de hacer", "Tags: cherry, acompañamiento, al centro"]}, {"name": "CONEJO ASADO", "category": "Carnes", "tags": [], "ingredients": ["½ conejo.", "1 cebolla grande.", "1 diente de ajo.", "1 rama de perejil.", "3 cucharadas de aceite.", "3 cucharadas de vino blanco.", "Sal gorda.", "3 hojas de laurel.", "Unas ramitas de tomillo (o una cucharadita de tomillo seco si no se tiene en rama)", "Precalentamos el horno a 180ºC.", "Majamos en el mortero el ajo con la sal y el perejil y le añadimos el aceite y el vino.", "Colocamos el conejo en una bandeja de horno o en una fuente amplia y lo regamos por ambos lados con el majado del mortero.", "Pelamos la cebolla, la partimos al medio, luego en lonchas y la distribuimos por encima del conejo. Luego, ponemos sobre ella las hojas de laurel y las ramitas de tomillo.", "Lo regamos con un chorrito de aceite y lo metemos al horno precalentado a 180º durante unos 50-60 minutos o hasta que lo veamos hecho. De vez en cuando, lo regamos con su salsa.", "La receta vale lo mismo para cordero o cabrito asado."], "steps": [{"type": "step", "text": "Precalentamos el horno a 180ºC."}, {"type": "step", "text": "Majamos en el mortero el ajo con la sal y el perejil y le añadimos el aceite y el vino."}, {"type": "step", "text": "Colocamos el conejo en una bandeja de horno o en una fuente amplia y lo regamos por ambos lados con el majado del mortero."}, {"type": "step", "text": "Pelamos la cebolla, la partimos al medio, luego en lonchas y la distribuimos por encima del conejo. Luego, ponemos sobre ella las hojas de laurel y las ramitas de tomillo."}, {"type": "step", "text": "[](https://4.bp.blogspot.com/-W_jNVZn2A2E/VWc5ebZRj9I/AAAAAAAAZEQ/A8lfXwWHu2s/s1600/conejo%2Basado%2B2.jpg)"}, {"type": "step", "text": "Lo regamos con un chorrito de aceite y lo metemos al horno precalentado a 180º durante unos 50-60 minutos o hasta que lo veamos hecho. De vez en cuando, lo regamos con su salsa."}, {"type": "step", "text": "A mitad de cocción, sacamos la bandeja, removemos la cebolla para que no se reseque y le damos la vuelta al conejo. Si viéramos que se nos tuesta demasiado, podemos, en este punto, taparlo con un papel de aluminio o de horno."}, {"type": "step", "text": "Una vez asado, pasamos el conejo con su cebollita a una fuente caliente y vertemos en la bandeja de hornearlo un vaso de agua raspando bien con una espátula todo la sustancia que se haya quedado pegada o reseca. Lo colamos sobre una salsera o sobre el propio conejo."}, {"type": "step", "text": "La receta vale lo mismo para cordero o cabrito asado."}], "intro": ["INGREDIENTES para dos personas", "- ½ conejo.", "- 1 cebolla grande.", "- 1 diente de ajo.", "- 1 rama de perejil.", "- 3 cucharadas de aceite.", "- 3 cucharadas de vino blanco.", "- Sal gorda.", "- 3 hojas de laurel.", "- Unas ramitas de tomillo (o una cucharadita de tomillo seco si no se tiene en rama)"]}, {"name": "CONEJO CON SALSA DE ZANAHORIAS", "category": "Carnes", "tags": [], "ingredients": ["Medio conejo", "La parte blanca de un puerro", "2 zanahorias", "2 dientes de ajo", "Unas ramitas de tomillo (o una cucharadita del seco)", "Una hoja de laurel", "Unos granos de pimienta negra", "Un vasito de vino blanco", "3 cucharadas de aceite de oliva  y  sal", "Cortamos el conejo en trozos, el puerro en aros finos y las zanahorias en ruedas.", "Ponemos el aceite en una cacerola (o en la olla exprés) y la llevamos al fuego. Agregamos enseguida el conejo junto con el puerro y las zanahorias.", "Añadimos luego el tomillo, el laurel, los dientes de ajo, los granos de pimienta y el vino.", "Sazonamos con sal, tapamos la cacerola y dejamos que cueza a fuego suave hasta que esté tierno. Si fuera necesario, añadimos un poquito de caldo de verduras o de agua.", "Una vez cocido, retiramos las hierbas y sacamos el conejo para una fuente.", "Trituramos con el pasapuré o con la batidora la salsa y se la volcamos al conejo por encima."], "steps": [{"type": "step", "text": "Cortamos el conejo en trozos, el puerro en aros finos y las zanahorias en ruedas."}, {"type": "step", "text": "Ponemos el aceite en una cacerola (o en la olla exprés) y la llevamos al fuego. Agregamos enseguida el conejo junto con el puerro y las zanahorias."}, {"type": "step", "text": "Añadimos luego el tomillo, el laurel, los dientes de ajo, los granos de pimienta y el vino."}, {"type": "step", "text": "Sazonamos con sal, tapamos la cacerola y dejamos que cueza a fuego suave hasta que esté tierno. Si fuera necesario, añadimos un poquito de caldo de verduras o de agua."}, {"type": "step", "text": "Una vez cocido, retiramos las hierbas y sacamos el conejo para una fuente."}, {"type": "step", "text": "Trituramos con el pasapuré o con la batidora la salsa y se la volcamos al conejo por encima."}, {"type": "step", "text": "Si podemos consumir nata y no nos importa hacerlo, podemos añadirle a la salsa una o dos cucharadas."}], "intro": ["INGREDIENTES para dos personas", "- Medio conejo", "- La parte blanca de un puerro", "- 2 zanahorias", "- 2 dientes de ajo", "- Unas ramitas de tomillo (o una cucharadita del seco)", "- Una hoja de laurel", "- Unos granos de pimienta negra", "- Un vasito de vino blanco", "- 3 cucharadas de aceite de oliva  y  sal"]}, {"name": "Crema calabaza Thai", "category": "Cremas y sopas", "tags": [], "ingredients": [], "steps": [], "intro": ["Media calabaza", "3 zanahorias", "Jengibre", "Piel de media naranja", "-> Hervir todo junto con un poco de sal hasta que esté cocinado", "-> Retirar el agua (yo he dejado un par de cucharadas).", "-> Añadir la leche de coco", "-> Triturar todo", "feedback inicial: muy dulce (demasiado), a Noe no le acaba. Quizá poner más sal o algún ingrediente adicional que sea salado ¿y en trozos? para que no se haga tan pesado.", "tags: comida, cena, instagram"]}, {"name": "Crema de lentejas al curry", "category": "Legumbres y cereales", "tags": [], "ingredients": ["4 dientes de ajo", "1 cebolla", "1 puerro", "1 pimiento verde", "1 pimiento rojo", "1 zanahoria", "3 patatas (450 g aproximadamente)", "1 hoja de laurel", "600 ml de caldo de verduras", "750 g de lentejas pardinas cocidas", "1 cucharada de curry", "AOVE", "Sal", "Pimentón"], "steps": [], "intro": ["https://www.bonviveur.es/recetas/crema-de-lentejas-al-curry", "1. Picamos todos los ingredientes: el ajo, la cebolla, el puerro, los pimientos y la zanahoria", "2. Salteamos, primero de todo, el ajo junto con la cebolla y el puerro", "3. Añadimos los pimientos y la zanahoria, y lo rehogamos todo junto", "4. Una vez pochados, añadimos el laurel, el pimentón y el curri. Dejamos que se tueste removiendo de vez en cuando durante unos 3 minutos", "5. Añadimos las lentejas, las patatas y el caldo de verduras. Cocemos durante 10 minutos", "6. Cuando la patata esté bien cocida, sacamos la hoja de laurel y lo trituramos todo bien hasta que tengamos una crema bien fina", "7. Servimos con un poco de perejil fresco picado por encima"]}, {"name": "Cuscús", "category": "Carnes", "tags": [], "ingredients": ["3 cebollas grandes", "Aceite de oliva y sal", "1/2 cdta de canela en polvo", "1 cdta de azúcar moreno", "1 puñado de pasas sultanas  o ciruelas", "Corta las cebollas en juliana y póchalas en una sartén con aceite de oliva y un poco de sal a fuego lento.", "Cuando esté tierna (después de unos 30 min), añadimos la canela, el azúcar y las pasas y cocinamos 10 minutos más.", "Es importante que quede muy tierna.", "400 g de carne", "1 cebolla", "Unas hebras de azafrán  (opcional)", "600 ml de caldo de verduras", "Corta la cebolla en juliana no muy fina y saltéala en una cacerola con aceite de oliva y una pizca de sal", "Añade la carne y el azafrán y cocina unos minutos más.", "2 tazas de cuscús", "2 tazas de agua", "Sal y cúrcuma", "Mantequilla vegetal o aceite de oliva", "Pon en un cazo el agua con la sal y la cúrcuma, lleva a ebullición y aparta del fuego.", "Echa el cuscús y tapa el cazo. Deja que se hidrate durante 3-4 minutos.", "Destapa, agrega la mantequilla vegetal y remueve para que no hayan grumos."], "steps": [], "intro": ["*CEBOLLA CARAMELIZADA", "- 3 cebollas grandes", "- Aceite de oliva y sal", "- 1/2 cdta de canela en polvo", "- 1 cdta de azúcar moreno", "- 1 puñado de pasas sultanas  o ciruelas", "- Corta las cebollas en juliana y póchalas en una sartén con aceite de oliva y un poco de sal a fuego lento.", "- Cuando esté tierna (después de unos 30 min), añadimos la canela, el azúcar y las pasas y cocinamos 10 minutos más.", "- Es importante que quede muy tierna.", "___", "*GUISO DE POLLO o CORDERO", "- 400 g de carne", "- 1 cebolla", "- 3-4 zanahorias", "- Unas hebras de azafrán  (opcional)", "- 600 ml de caldo de verduras", "- Corta la cebolla en juliana no muy fina y saltéala en una cacerola con aceite de oliva y una pizca de sal", "- Añade la carne y el azafrán y cocina unos minutos más.", "- Agrega las zanahorias troceadas y el caldo de verduras y deja que se cocine a fuego lento con la tapa puesta durante 20-25 minutos. Destapa y cocina 5 minutos más. Puedes agregar más caldo si lo necesitara.", "___", "*CUSCÚS", "- 2 tazas de cuscús", "- 2 tazas de agua", "- Sal y cúrcuma", "- Mantequilla vegetal o aceite de oliva", "- Pon en un cazo el agua con la sal y la cúrcuma, lleva a ebullición y aparta del fuego.", "- Echa el cuscús y tapa el cazo. Deja que se hidrate durante 3-4 minutos.", "- Destapa, agrega la mantequilla vegetal y remueve para que no hayan grumos.", "___", "Emplatar con el cuscús en la base, las verduras y la carne por encima y coronar con la cebolla caramelizada.", "Feedback: muy bueno.", "Tag: Elaborado, marroquí, cuscús"]}, {"name": "Ensalada de col", "category": "Carnes", "tags": [], "ingredients": [], "steps": [{"type": "step", "text": "Cortamos la col en rodajas muy finas. Al hacerlo, debido a la forma natural de esta hortaliza, obtendremos un corte en juliana muy fino, casi en hilos."}, {"type": "step", "text": "Ponemos la col en un bol y hacemos la misma operación con las zanahorias y con la manzana."}, {"type": "step", "text": "Mezclamos y trabajamos bien los tres ingredientes para que se distribuyan de forma homogénea. Si queremos añadir cebolla que es un ingrediente opcional la cortamos de la misma manera y la mezclamos con el resto de alimentos."}, {"type": "step", "text": "Para hacer la salsa, mezclamos 4 cucharadas de creme fraiche (podemos utilizar también nata) con 2 cucharadas soperas de mayonesa y 2 cucharaditas de postre de mostaza. Añadimos un buen chorro de vinagre y lo movemos con unas varillas hasta hacerlo una crema homogénea."}, {"type": "step", "text": "Aliñamos la ensalada con la salsa, removemos bien para que se reparta entre los \"hilillos\" de col, zanahoria y manzana y la dejamos en la nevera un mínimo de dos horas antes de servir."}, {"type": "step", "text": "Al hacerlo, retiramos el líquido que pueda haber soltado la col y disfrutamos de su delicioso sabor dulzón que combina tan bien con las carnes a la parrilla."}, {"type": "step", "text": "https://www.directoalpaladar.com/recetas-de-ensaladas/como-hacer-ensalada-de-col-receta-americana-de-ensalada-coleslaw"}], "intro": ["Media col blanca, 2 zanahorias, media manzana, 2 cucharadas de mayonesa, 4 cucharadas de crema agria, mostaza de Dijon, vinagre y 75g de cebolla."]}, {"name": "Ensalada de garbanzos crujientes especiados", "category": "Legumbres y cereales", "tags": [], "ingredients": ["Sal", "Pimienta", "Curry", "Pimenton", "AOVE", "mix verde de base", "aguacate", "queso feta", "tomate seco", "los garbanzos", "aliño:", "1 cdta de mostaza dijon", "1 cdta de vinagre", "2 cda de AOVE"], "steps": [], "intro": ["Garbanzos :", "- Sal", "- Pimienta", "- Curry", "- Pimenton", "- AOVE", "Remover y esparcir por toda la bandeja del horno.", "Cocinarlos al horno 30’ a 180°C.", "Ensalada:", "- mix verde de base", "- aguacate", "- queso feta", "- tomate seco", "- los garbanzos", "- aliño:", "- 1 cdta de mostaza dijon", "- 1 cdta de vinagre", "- 2 cda de AOVE", "Feedback: Muy bueno y ràpido de hacer. Los garbanzos cogen mucho sabor.", "Tags: legumbres, ensalada, aguacate"]}, {"name": "Ensalada griega", "category": "Ensaladas y verduras", "tags": [], "ingredients": ["15 Tomates Cherry.", "1 Pepino.", "1 pimiento verde.", "1/2 cebolla morada.", "Sal.", "Queso feta.", "Picar la cebolla, el pepino, el pimiento y los cherry.", "Poner en un plato con un poco de sal.", "Remover bien.", "Poner el queso feta en tacos.", "AOVE (aceite de oliva virgen extra).", "12 aceitunas negras.", "2 Cdtas. De alcaparras.", "Orégano.", "1/2 limón exprimido.", "Un poco del suero del queso feta.", "Añadir todo a un bote y remover bien", "Servir sobre la ensalada"], "steps": [], "intro": ["Para el aliño:", "Feedback:", "Tags: ensalada, fresca"]}, {"name": "Ensalada niçoise", "category": "Pescado y marisco", "tags": [], "ingredients": [], "steps": [{"type": "step", "text": "Cocemos al vapor las patatas, cuando falten unos minutos para que estén cocidas echar las judías y dejarlas hasta que estén al dente. En otro cacito cocemos los huevos. Mientras, lavamos las verduras y las vamos troceando. En una bandeja hacemos una cama con la lechuga, añadimos los tomates picados, las alcaparras, el pimiento en trozos, las aceitunas picadas y la cebolleta en tiras. Cuando enfríen un poco echamos las patatas, las judías verdes y los huevos duros en trocitos, por último el atún escurrido de su aceite y las anchoas. Salpimentamos. Para hacer la vinagreta, en un bol echamos una cucharada de mostaza, añadimos el vinagre y mezclamos y por último incorporamos el aceite. Revolvemos con unas varillas hasta que todo se una. Repartimos por la ensalada."}, {"type": "step", "text": "https://www.directoalpaladar.com/recetas-de-ensaladas/ensalada-nicoise-receta"}], "intro": ["3 tomates pequeños, 1 cebolleta, ½ pimiento rojo pequeño, 2 huevos , 180 g de atún en conserva, 8 filetes de anchoa, 12 aceitunas negras, 100 g de judías verdes redondas, 4 patatitas nuevas,1 cucharada de alcaparras, 1 lechuga o 100 g de mezclum de lechugas, sal y pimienta. Para la vinagreta: 1 cucharada de mostaza de Dijón, 4 cucharadas de aceite de oliva, 2 cucharadas de vinagre blanco."]}, {"name": "Ensalada poke de atún y algas con aguacate", "category": "Pescado y marisco", "tags": [], "ingredients": ["Atún fresco150 g", "Alga wakame seca3 g", "Alga hijiki seca2 g", "Cebolleta pequeña1", "Cebollino3", "Aguacate pequeño (o medio grande)1", "Semillas de sésamo negro5 g", "Salsa de soja baja en sal5 ml", "Aceite de sésamo opcional2 ml", "Chile seco al gusto", "Zumo de limón o lima", "Sal una pizca"], "steps": [], "intro": ["Para 1 personas", "Pasos:", "Si usamos pescado congelado, descongelar la noche antes sobre una rejilla en la parte menos fría de la nevera. Secar bien con papel de cocina y cortar en cubos de tamaño de un bocado con un buen cuchillo. Reservar.", "Rehidratar las algas wakame y las hijiki en un cuenco con agua caliente, unos 5-10 minutos. Escurrir muy bien y picar. Lavar y picar la cebolleta muy fina y el cebollino. Cortar en gajos el aguacate sin la piel. Tostar las semillas de sésamo si se desea.", "Disponer en un plato o fuente el pescado y mezclar con la cebolleta, la mitad del cebollino, las algas, la salsa de soja y el aceite de sésamo. Colocar en un cuenco de servir y añadir el aguacate, al que mojaremos con un poco de zumo de lima o limón. Añadir un poco de cayena, sal y decorar con el resto del cebollino.", "https://www.directoalpaladar.com/recetas-de-pescados-y-mariscos/ensalada-poke-de-atun-y-algas-con-aguacate-receta-hawaiana"]}, {"name": "Ensalada Waldorf", "category": "Ensaladas y verduras", "tags": [], "ingredients": [], "steps": [{"type": "step", "text": "Tostamos ligeramente en una sartén las nueces. Cuando pasen unos minutos y las veamos tostadas, las reservamos mientras que enfrían y las partimos en trozos grandes. Para hacer la mayonesa, en un bol echamos la yema de huevo, salamos y comenzamos a batir con batidor o las varillas de una batidora incorporando el aceite en chorro fino para que se haga la emulsión. Añadimos el vinagre y reservamos en frío. Pelamos y cortamos las manzanas en dados o bastones, el apio en trozos menudos y lavamos y centrifugamos la lechuga. Seguidamente en una ensaladera ponemos el apio, la manzana, la mitad de las nueces y las uvas pasas, echamos la mayonesa al gusto y mezclamos bien. En la fuente de servicio ponemos una cama de lechuga troceada, por encima la mezcla de apio, manzana, nueces y pasas con la mayonesa, y finalmente decoramos con el resto de las nueces. Servir rápidamente."}, {"type": "step", "text": "https://www.directoalpaladar.com/recetas-de-ensaladas/ensalada-waldorf-receta"}], "intro": ["4 cogollos de lechuga, 3 ramas de apio, 2 manzanas Granny Smith, 125g de nueces, 125g de pasas sultanas, 1 yema de huevo, 30ml de vinagre, 150ml de aceite y sal al gusto."]}, {"name": "Fajita healthy (rápida)", "category": "Platos completos", "tags": [], "ingredients": [], "steps": [], "intro": ["Cortar tomate en rodajas finas", "Hervir huevo y cortarlo en láminas", "Calentar a la sarten una fajita (con un corte desde el centro hacia fuera):", "poner el queso en una de las 4 partes de la fajita", "Cuando esté caliente sacar la fajita y poner en el resto de las partes:", "-Guacamole", "-Tomate", "-Huevo", "Dobla las partes entre si para que quede un triángulo y calentar un poquito más a la sarten.", "Feedback inicial: Muy bueno y rápido de hacer.", "tags: comida, cena, fajita"]}, {"name": "Fajitas de gambas", "category": "Pescado y marisco", "tags": [], "ingredients": [], "steps": [], "intro": ["Hacemos en tacos:", "Aguacate", "Mango", "Picamos:", "Cebolla", "Pimineto verde", "Cilantro (opcional)", "Lima", "Removemos las Gambas con la cebolla picada y especias:", "Ajo", "Pimenton", "Pimienta", "Aceite oliva", "Y las cocinamos a la plancha", "Mezclamos:", "Los tacos de Mango y Aguacate, con ¿cilantro?, sal y lima", "En una fajita ponemos:", "Base de yogurt", "Gambas", "La mezcla de mango aguacate, etc", "Feedback inicial: La primera vez lo hemos hecho con atún a tacos. El contraste muy bueno. Con gambas seguro que mejor.", "Tag: fajita, gambas, dulce-salado"]}, {"name": "Laab gai tailandés", "category": "Pescado y marisco", "tags": [], "ingredients": [], "steps": [{"type": "step", "text": "Pica la cebolla roja en juliana muy fina y ponla en agua fría para que pierda fuerza mientras haces el resto de elaboraciones. Si no encuentras polvo de arroz tostado –que se vende en los supermercados asiáticos– puedes hacerlo muy fácilmente en casa. Basta calentar una sartén sin aceite a temperatura baja y verter un buen puñado de arroz largo. El arroz debe tostarse lentamente sin que llegue a quemarse. Una vez que todo el arroz tenga un color marrón, se debe picar fino en un molinillo de café o especias. Para esta receta solo necesitamos dos cucharaditas, pero se puede conservar en un bote como cualquier otra especia durante mucho tiempo. En una sartén (si es grande te sirve la misma en la que has tostado el arroz) pon el caldo de pollo y deja que se caliente. Añade entonces la carne picada y cocinala lentamente. Nos interesa que quede jugosa, por lo que es mejor cocinarla a fuego lento para que no llegue a caramelizarse. Salpimenta al gusto, retírala del fuego y deja que se temple. En un bol grande mezcla la cebolla roja (que ya habrá perdido potencia), las cebolletas cortadas en aros finos, el chile picado, y dos buenos puñados de cilantro y menta picados. Incorpora la carne y los copos de chile. El aliño de esta ensalada es el que suelen llevar todas las ensaladas tailandesas. Mezcla la salsa de pescado, el zumo de lima, el agua y el azucar, y removiendo bien con una cucharilla. Podemos hacer de más si planeamos usarla para otras elaboraciones, pero para esta ensalada bastan cuatro cucharadas (aunque está bien tener más a mano para añadir al gusto). Incorpora el polvo de arroz y mezcla todos los ingredientes con el aliño y deja que la ensalada repose unos minutos antes de servirla."}, {"type": "step", "text": "https://www.directoalpaladar.com/recetas-de-ensaladas/laab-gai-receta-facil-clasica-ensalada-tailandesa-pollo-que-siempre-triunfa"}], "intro": ["400g de carne picada de pollo, 4 cucharadas de caldo de pollo, media cebolla roja, 2 cebolletas chinas (o normales), 1 chile ojo de pájaro u otro chile fresco, cilantro fresco, menta fresca, 1 cucharadita de polvo de arroz tostado, sal, pimienta negra molida, 2 cucharadas de salsa asiática de pescado, 2 cucharadas de zumo de lima, 2 cucharaditas de azúcar y 1 cucharada de agua."]}, {"name": "Lubina a la donostiarra", "category": "Pescado y marisco", "tags": [], "ingredients": ["Elaboración. Precalentar el horno a 200ºC y engrasar una fuente."], "steps": [], "intro": ["- Ingredientes para 2 personas. 2 lubinas de ración limpias enteras, 4 dientes de ajo (más o menos, al gusto), 2 guindillas secas o frescas, 20 ml de vinagre de sidra o de vino blanco, perejil fresco , sal, pimienta negra molida, aceite de oliva virgen extra.", "- Elaboración. Precalentar el horno a 200ºC y engrasar una fuente.", "Calentar un poco de aceite en una sartén o plancha y dorar la lubina con la piel hacia arriba, unos 3 minutos.", "Colocar en la bandeja de horno al revés, con la piel hacia abajo. Añadir un poco de pimienta y sal (opcional), llevar al horno durante unos 8-10 minutos o hasta que esté en su punto.", "Mientras tanto laminar finos los dientes de ajo y picar o cortar en aros la guindilla.", "Calentar unas 4 cucharadas de aceite de oliva virgen extra en la misma sartén o en un cazo y echar el ajo. Esperar un par de minutos y añadir la guindilla. Cocinar a fuego medio-bajo sin despistarnos.", "Cuando estén tostaditos, retirar y agregar el vinagre, meneando la sartén. Echar también los posibles jugos que habrá soltado la lubina, que ya estará lista.", "Servir con el refrito y perejil picado."]}, {"name": "Pastela marroquí", "category": "Carnes", "tags": [], "ingredients": ["3 contramuslos de pollo grandes, 750 g aprox.", "500 g de cebolla finamente laminada", "3 cucharadas de aceite de oliva", "2 vasos de agua", "45 g de perejil, sin tallos", "15 g de cilantro fresco, solo las hojas", "6 huevos L", "135 g de almendra cruda", "1/2 cucharada de miel", "3/4 cucharadita de cúrcuma en polvo", "1/2 cucharadita de jengibre en polvo", "una pizca de azafrán", "3 cucharaditas de azúcar glas", "1 cucharadita de canela en polvo", "sal al gusto", "pimienta negra al gusto", "6 hojas de masa filo", "135 g de mantequilla fundida y enfriada o ghee", "azúcar glas", "canela en polvo"], "steps": [{"type": "step", "text": "En una cazuela amplia y con fondo, vertemos el aceite y colocamos a calor medio."}, {"type": "step", "text": "Introducimos el pollo junto con la cebolla laminada y salteamos durante unos minutos. Observaremos como comienza a cambiar la tonalidad de la carne."}, {"type": "step", "text": "Añadimos las especias junto con el perejil y el cilantro finamente picado. Removemos para distribuir los ingredientes."}, {"type": "step", "text": "Salpimentamos al gusto, vertemos el agua, colocamos la tapadera dejando una abertura y cocinamos a calor medio bajo durante 60-65 minutos. La carne debe estar tierna."}, {"type": "step", "text": "Una vez que la carne está lista, sacamos de la olla y dejamos enfriar por completo en una fuente."}, {"type": "step", "text": "Dejamos la cebolla con el resto de ingredientes en la cazuela."}, {"type": "step", "text": "Una vez que esté frío, retiramos la piel, los huesos y desmigamos. Reservamos."}, {"type": "step", "text": "Añadimos la miel y cocinamos a calor medio bajo la cebolla y aromáticas hasta que el líquido se reduzca por completo. Este punto es importante para que no rezume en el relleno."}, {"type": "step", "text": "Una vez que tenemos esta mezcla reducida, añadimos los huevos y removemos constantemente hasta que cuajen."}, {"type": "step", "text": "Retiramos del calor, pasamos a una fuente y dejamos que enfríe por completo."}, {"type": "step", "text": "En una sartén amplia añadimos las almendras junto con una cucharada de aceite de oliva y colocamos a calor medio."}, {"type": "step", "text": "Cocinamos hasta que adquieran un ligero color dorado y se vuelvan fragantes."}, {"type": "step", "text": "Retiramos del calor y procesamos hasta obtener una textura ligeramente gruesa."}, {"type": "step", "text": "Añadimos el azúcar glas tamizado y la canela, mezclamos para homogeneizar."}, {"type": "step", "text": "Volcamos en un cuenco  dejamos que enfríe por completo."}, {"type": "subheading", "text": "Montamos la pastela."}, {"type": "step", "text": "Precalentamos el horno a 220ºC con calor arriba y abajo."}, {"type": "step", "text": "Pincelamos con mantequilla el molde o recipiente que vayamos a utilizar para montar la pastela. El mío es de 16 cm de diámetro."}, {"type": "step", "text": "Cogemos una hoja de masa filo, pincelamos ligeramente la superficie con mantequilla y colocamos sobre el recipiente. Aseguraos que la masa queda totalmente ajustada al recipiente"}, {"type": "step", "text": "Disponemos una capa de pollo en la base. Recordad que debemos dividir para hacer dos pasteles."}, {"type": "step", "text": "Sobre esta, colocamos una capa de huevo revuelto con la cebolla y aromáticas."}, {"type": "step", "text": "Terminamos con una capa de almendra."}, {"type": "step", "text": "Plegamos la masa filo sobre el relleno y, a la vez, pincelamos con un poco de mantequilla para evitar que se seque en exceso. Si las uniones de la masa no se quedan unidas, podemos pincelarlas con un poco de huevo batido."}, {"type": "step", "text": "Pincelamos otra lámina de masa filo ligeramente con mantequilla."}, {"type": "step", "text": "Volcamos la pastela que tenemos dentro del recipiente sobre la lámina y plegamos de nuevo los extremos llevándolos al centro."}, {"type": "step", "text": "Repetimos este proceso una vez más, en total utilizaremos 3 láminas por pastel."}, {"type": "step", "text": "La capa del pollo debe quedar en la parte superior y las almendras en la base de la pastela."}, {"type": "step", "text": "Colocamos en una bandeja forrada con papel de horno."}, {"type": "subheading", "text": "Horneamos."}, {"type": "step", "text": "Pincelamos el exterior de ambas pastelas con mantequilla y horneamos a media altura durante 25 minutos. Tomarán un ligero color dorado."}, {"type": "step", "text": "Sacamos y dejamos enfriar por completo sobre una rejilla."}, {"type": "step", "text": "Antes de servir, espolvoreamos con azúcar glas y canela."}, {"type": "step", "text": "*Si queremos dividir el proceso en 2 días;: El primero cocinad el pollo, reducid el caldo de la cebolla y aromáticas y preparar las almendras. Una vez que esté frío todo, guardamos en recipientes herméticos y refrigeramos (a excepción de las almendras). El segundo día cocinad los huevos, montad la pastela y horneadla."}, {"type": "step", "text": "https://bake-street.com/pastela-marroqui-de-pollo/"}], "intro": ["PARA EL RELLENO:", "PARA ENVOLVER LA PASTELA:"]}, {"name": "PECHUGA DE POLLO CON CALABACINES GRATINADA", "category": "Carnes", "tags": [], "ingredients": ["Una pechuga de pollo (o media de pavo)", "Un calabacín mediano", "Queso rallado", "Una cucharada rasa de harina", "Aceite de oliva y sal", "Un caldo: puerro - zanahoria - diente de ajo - perejil o apio - laurel - agua"], "steps": [{"type": "step", "text": "*Escalfamos la pechuga**"}, {"type": "step", "text": "Ponemos agua en una cacerola y cocemos con ella todas las verduras para el caldo, limpias y troceadas."}, {"type": "step", "text": "Cuando las verduras estén cocidas, introducimos la pechuga partida en dos porciones, bajamos el fuego al mínimo de forma que no hierva, tapamos la cacerola y lo dejamos durante unos 10 minutos."}, {"type": "step", "text": "Es importante que la pechuga no llegue a hervir pues de lo que se trata es de que la carne absorba los sabores del caldo. Quedará hecha pero al mismo tiempo tierna y jugosa."}, {"type": "step", "text": "[](https://3.bp.blogspot.com/-q-8PIctzpvY/U5tiw3PQiDI/AAAAAAAAV5s/HVvnrmWwU1k/s1600/pechuga.jpg)"}, {"type": "step", "text": "Mientras, lavamos el calabacín y le quitamos el rabo pero no lo pelamos."}, {"type": "step", "text": "Lo troceamos (a mi me gusta en forma de bastoncitos) y lo salteamos en una cucharada de aceite, a fuego vivo, moviéndolo para que se doren  todos los trozos."}, {"type": "step", "text": "Colocamos el calabacín salteado en una fuente de horno o bien en recipientes individuales."}, {"type": "step", "text": "Sacamos las pechugas del caldo y las colocamos encima de los calabacines."}, {"type": "step", "text": "En función del recipiente que utilicemos, la pechuga puede ir entera como en la foto siguiente o cortada en trozos como en la de la portada."}, {"type": "step", "text": "[](https://3.bp.blogspot.com/-lxtoucWuv6w/U5ti52xqZDI/AAAAAAAAV50/HofhHEdI9JQ/s1600/pechuga+8.jpg)"}, {"type": "step", "text": "Le retiramos al caldo la hoja de laurel y trituramos todo lo demás con la batidora. Nos resultará una crema que enseguida utilizaremos."}, {"type": "step", "text": "Ponemos ahora en una sartén las dos cucharadas de aceite y la cucharada de harina y la rehogamos."}, {"type": "step", "text": "[](https://4.bp.blogspot.com/-wpgrnToypWk/U5tjJmaaTFI/AAAAAAAAV6A/IJPIULxUFso/s1600/pechua+4.jpg)"}, {"type": "step", "text": "Agregamos a la sartén la crema anterior poco a poco y revolviendo para que no se hagan grumos."}, {"type": "step", "text": "En este punto, se le puede añadir un poquito de leche si la vemos muy espesa o dejarla tal cual."}, {"type": "step", "text": "Cubrimos las pechugas con esta salsa, lo espolvoreamos con el queso rallado y lo metemos al horno a gratinar."}, {"type": "step", "text": "[](https://2.bp.blogspot.com/-gM_PeSjXVwc/WQYokLgcF0I/AAAAAAAAjiE/wwUECC2qt4caag8K0Cp1V5JBG5vf3FDrACLcB/s1600/CALABAC%25C3%258DN-CON-PECHUGA3.jpg)"}], "intro": ["Para dos personas"]}, {"name": "PECHUGAS DE POLLO A LA NARANJA EN WOK", "category": "Pescado y marisco", "tags": [], "ingredients": ["Una pechuga de pollo.", "Una cebolla.", "2 o 3 zanahorias.", "2 dientes de ajo.", "Una cucharadita de harina.", "Zumo de naranja (150ml).", "Aceite de oliva.", "Sal y pimienta blanca molida."], "steps": [{"type": "step", "text": "Cortamos la pechuga en tacos, la sazonamos con sal y pimienta blanca y la salteamos a fuego vivo en el wok con un chorrito de aceite."}, {"type": "step", "text": "[](https://3.bp.blogspot.com/-gzM6s07jQMU/UKe-5PiSsBI/AAAAAAAAOb8/j-GWWGAWyBo/s1600/pn1.jpg)"}, {"type": "step", "text": "Una vez dorada, la sacamos para una fuente y la reservamos."}, {"type": "step", "text": "En el mismo aceite salteamos la cebolla, la zanahoria y los ajos previamente troceados, moviéndolo de vez en cuando para que se haga uniformemente."}, {"type": "step", "text": "[](https://1.bp.blogspot.com/-Qp0kC1kd56g/UKe-6cd0z4I/AAAAAAAAOcE/WsFRZ7Os-UQ/s1600/pn2.jpg)"}, {"type": "step", "text": "Después del salteado, agregamos la cucharadita de harina, revolvemos para que se rehogue y vertemos el zumo."}, {"type": "step", "text": "[](https://1.bp.blogspot.com/-9Grw_peM23k/UKe-7irRgKI/AAAAAAAAOcM/vQxxkFD0EAA/s1600/pn3.jpg)"}, {"type": "step", "text": "Tapamos el wok y dejamos que cueza por espacio de 15 o 20 minutos o hasta que las hortalizas están prácticamente hechas."}, {"type": "step", "text": "Transcurrido este tiempo, introducimos de nuevo en el wok los trozos de pechuga y dejamos que se haga todo junto, unos pocos minutos más. Muy pocos, para que la pechuga no se quede demasiado hecha y no pierda su jugosidad."}], "intro": ["INGREDIENTES para dos personas", "- Una pechuga de pollo.", "- Una cebolla.", "- 2 o 3 zanahorias.", "- 2 dientes de ajo.", "- Una cucharadita de harina.", "- Zumo de naranja (150ml).", "- Aceite de oliva.", "- Sal y pimienta blanca molida."]}, {"name": "Pollo con anchoas", "category": "Carnes", "tags": [], "ingredients": ["Los muslos y contramuslos de un pollo (de corral o normal).", "Media cebolla.", "Un diente de ajo.", "4 anchoas en aceite.", "Un vasito pequeño de vino blanco (125ml).", "Media cucharadita de curry en polvo.", "Media manzana golden.", "Un plátano (opcional).", "Una cucharada de zumo de limón.", "2 cucharadas de leche.", "Una cucharadita de harina.", "Aceite, sal y pimienta."], "steps": [{"type": "step", "text": "Cortamos la cebolla en cuadritos y la rehogamos en un par de cucharadas de aceite."}, {"type": "step", "text": "[](https://1.bp.blogspot.com/-lbtUeWSTgAY/VkdezUhShFI/AAAAAAAAa7Q/UjBvmtbDOUI/s1600/pollo%2Briquisimo%2B4.jpg)"}, {"type": "step", "text": "Sazonamos los pedazos de pollo con sal y pimienta."}, {"type": "step", "text": "Agregamos el pollo al rehogo de cebolla y dejamos que se dore."}, {"type": "step", "text": "[](https://4.bp.blogspot.com/-Adu5CNYqA4M/VkdezC2X2aI/AAAAAAAAa68/VTvKV2hqYJI/s1600/pollo%2Briquisimo%2B3.jpg)"}, {"type": "step", "text": "Majamos en el mortero el diente de ajo pelado junto con las anchoas. Vertemos el vino en el mortero, revolvemos la mezcla y se lo añadimos al pollo."}, {"type": "step", "text": "Pelamos la manzana y la cortamos en cuadritos."}, {"type": "step", "text": "Sazonamos el guiso con el curry, añadimos los pedacitos de manzana y el zumo de limón, tapamos y dejamos que se guise hasta que el pollo esté tierno. Si es de corral, tardará unos cuantos minutos más."}, {"type": "step", "text": "Cuando el pollo está guisado, lo sacamos para una fuente de servir y lo mantenemos caliente."}, {"type": "step", "text": "[](https://1.bp.blogspot.com/-j-4DPiL19AI/VkdezJaesjI/AAAAAAAAa7M/iDtteiVD7Zw/s1600/pollo%2Briquisimo%2B2.jpg)"}, {"type": "step", "text": "Ponemos dos cucharadas de leche fría en un cuenco y disolvemos en ella la harina. Lo agregamos a la salsa de cocer el pollo y dejamos que de un hervor, revolviendo para que la salsa se espese."}, {"type": "step", "text": "En el último momento, agregamos el plátano partido en rodajitas y lo volcamos todo por encima del pollo."}, {"type": "step", "text": "Podemos acompañarlo (aunque no es necesario) con una ensalada de lechuga y manzana, con arroz blanco o con hortalizas salteadas."}], "intro": ["Para dos personas"]}, {"name": "POLLO CON CURRY AL ESTILO INDIO", "category": "Carnes", "tags": [], "ingredients": ["1 pollo.", "1 cebolla.", "Aceite.", "Caldo (o en su defecto, agua).", "2 manzanas.", "3 cucharaditas de curry en polvo.", "1 cucharada de harina.", "4 cucharadas de leche evaporada o en su defecto de nata o leche normal.", "1 cucharadita de miel.", "1 pizca de pimienta blanca y sal.", "2 cucharadas de pasas.", "2 cucharadas de almendras tostadas partidas por la mitad.", "1 plátano"], "steps": [{"type": "step", "text": "Primero preparamos el caldo con la carcasa del pollo, unos cascos de cebolla, un ajo, perejil, y cualquier otra verdura que tengamos a mano (puerro, zanahoria...)."}, {"type": "step", "text": "Pelamos y troceamos el pollo. Si queremos perder más tiempo, lo deshuesamos pero tampoco es imprescindible."}, {"type": "step", "text": "Cortamos la cebolla en cuadritos."}, {"type": "step", "text": "Ponemos en la cacerola un chorro de aceite y rehogamos en ella el pollo. Incorporamos la cebolla y dejamos que se rehogue también."}, {"type": "step", "text": "Añadimos un poco del caldo preparado anteriormente (o agua) y dejamos que cueza tapado y a fuego suave durante 20 ó 30 minutos, dependiendo del tipo de pollo. Si es de corral tardará más tiempo en cocerse."}, {"type": "step", "text": "Mientras, pelamos y cortamos a cuadritos las manzanas y las añadimos a la cazuela junto con el curry, dejando que cueza otros 5 minutos más."}, {"type": "step", "text": "Desleímos la harina en un poquito de caldo y la añadimos al guiso. Sazonamos también en este momento con la miel, pimienta y sal."}, {"type": "step", "text": "Por último, incorporamos la nata o leche, las pasas y las almendras."}, {"type": "step", "text": "Y ya en el momento de ir a servirlo, incorporamos el plátano, previamente pelado y cortado en ruedecitas."}], "intro": ["[](https://2.bp.blogspot.com/_mvXkdlh0KrI/S-_dvaKDUQI/AAAAAAAAD5Q/tTc4oD5LYoE/s1600/pc+6.jpg)"]}, {"name": "Quinoa con garbanzos y cúrcuma", "category": "Legumbres y cereales", "tags": ["legumbres"], "ingredients": [], "steps": [], "intro": []}, {"name": "Solomillo Filet Mignon", "category": "Carnes", "tags": [], "ingredients": ["Medallones de solomillo", "Aceite", "Sal pimienta", "2 tazas de champiñones laminados", "1 cebolla pequeña picada muy fina", "2 dientes de ajos picados", "2 cucharadas de mantequilla", "1 cucharada de tomillo fresco picado", "½ vaso de vino seco", "1 de caldo de carne", "½ de nata de cocina", "Sal y pimienta"], "steps": [{"type": "step", "text": "Salpimienta la carne y sella en la plancha caliente."}, {"type": "step", "text": "Derrite la mantequilla en los jugos que ha soltado el solomillo."}, {"type": "step", "text": "Añade los champiñones en láminas y cocina hasta que se ablanden."}, {"type": "step", "text": "Pon la cebolla picada y sofríe todo."}, {"type": "step", "text": "Echa el ajo picado, el tomillo, la sal y la pimienta."}, {"type": "step", "text": "Añade los champiñones laminados, el vino tinto y saltea. Cocina revolviendo durante un par de minutos."}, {"type": "step", "text": "Retira los champiñones y, en la misma sartén, pon a fuego medio-alto el vino hasta que reduzca a la mitad."}, {"type": "step", "text": "Vierte el caldo y vuelve a reducir."}, {"type": "step", "text": "Incorpora la nata y revuelve hasta que quede una salsa espesa."}, {"type": "step", "text": "Añade la carne y los champiñones."}, {"type": "step", "text": "Calienta y sirve."}], "intro": ["Para la salsa"]}, {"name": "Sopa de boniato y garbanzos", "category": "Legumbres y cereales", "tags": ["legumbres"], "ingredients": [], "steps": [], "intro": []}];
let cat='Todas';const filters=document.getElementById('filters'),grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),listing=document.getElementById('listing'),view=document.getElementById('recipe');const cats=['Todas',...new Set(RECIPES.map(r=>r.category))];cats.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>{cat=c;render()};filters.appendChild(b)});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function linkify(s){return esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a class="url" target="_blank" rel="noopener" href="$1">$1</a>')}function render(){[...filters.children].forEach(b=>b.classList.toggle('active',b.textContent===cat));let q=search.value.toLowerCase().trim();let arr=RECIPES.map((r,i)=>({...r,i})).filter(r=>(cat==='Todas'||r.category===cat)&&(!q||(r.name+' '+r.category+' '+r.tags.join(' ')+' '+r.ingredients.join(' ')+' '+r.steps.map(x=>x.text).join(' ')).toLowerCase().includes(q)));count.textContent=arr.length+' receta'+(arr.length===1?'':'s');grid.innerHTML=arr.length?arr.map(r=>`<article class="card" onclick="openRecipe(${r.i})"><div class="cat">${esc(r.category)}</div><h2>${esc(r.name)}</h2><div class="preview">${esc((r.ingredients.slice(0,3).join(' · ')||r.intro.slice(0,1).join(' ')).slice(0,170))}</div>${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</article>`).join(''):'<div class="empty">No se han encontrado recetas.</div>'}search.oninput=render;function openRecipe(i){let r=RECIPES[i];let n=0;view.innerHTML=`<button class="back" onclick="closeRecipe()">← Volver al recetario</button><div class="recipe-title"><div class="cat">${esc(r.category)}</div><h1>${esc(r.name)}</h1><div class="meta">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><div class="body"><aside class="panel"><h3>Ingredientes</h3>${r.ingredients.length?r.ingredients.map(x=>`<div class="ing">${esc(x)}</div>`).join(''):'<div class="intro">No se han indicado ingredientes de forma estructurada.</div>'}</aside><div class="panel">${r.intro.length?`<div class="intro">${r.intro.map(x=>linkify(x)).join('<br>')}</div>`:''}<h3>Preparación</h3>${r.steps.length?r.steps.map(s=>s.type==='subheading'?`<div class="subheading">${esc(s.text)}</div>`:`<div class="step"><div class="num">${++n}</div><div class="steptext">${linkify(s.text)}</div></div>`).join(''):'<div class="intro">Esta receta no contiene pasos de elaboración en el archivo original.</div>'}</div></div>`;listing.style.display='none';view.classList.add('show');scrollTo({top:0,behavior:'smooth'})}function closeRecipe(){view.classList.remove('show');listing.style.display='block';scrollTo({top:0,behavior:'smooth'})}render();</script></body></html>
