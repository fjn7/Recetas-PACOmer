<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetas PACOmer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #faf8f4;
      color: #292722;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e8e2d8;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1180px;
      margin: auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .logo {
      width: 170px;
      height: 58px;
      object-fit: contain;
      object-position: left center;
      flex-shrink: 0;
    }
    .search {
      width: 100%;
      max-width: 480px;
      margin-left: auto;
      padding: 12px 16px;
      border: 1px solid #ddd6ca;
      border-radius: 12px;
      background: #faf8f4;
      font-size: 15px;
      outline: none;
    }
    .search:focus { border-color: #aaa092; }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 20px 60px;
    }
    .intro { margin-bottom: 28px; }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: -1px;
    }
    .intro p {
      margin: 0;
      color: #746e64;
      font-size: 16px;
    }

    .recipes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #e8e2d8;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(40, 32, 20, .08);
    }
    .card-image {
      width: 100%;
      height: 205px;
      display: block;
      object-fit: cover;
      background: #eee9e0;
    }
    .card-body { padding: 18px 18px 20px; }
    .card h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.25;
    }
    .card .count {
      margin-top: 9px;
      color: #81796e;
      font-size: 13px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(20, 18, 15, .58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: #fff;
      width: min(900px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px;
      position: relative;
    }
    .modal-image {
      width: 100%;
      height: min(380px, 45vh);
      object-fit: cover;
      display: block;
      background: #eee9e0;
    }
    .modal-body { padding: 28px 30px 34px; }
    .modal h2 {
      margin: 0 0 24px;
      font-size: 32px;
      letter-spacing: -.5px;
    }
    .modal h3 {
      margin: 24px 0 10px;
      font-size: 18px;
    }
    .modal ul, .modal ol {
      margin: 0;
      padding-left: 24px;
      line-height: 1.65;
    }
    .modal li { margin-bottom: 6px; }
    .close {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      font-size: 25px;
      cursor: pointer;
      z-index: 2;
    }
    .empty {
      text-align: center;
      color: #81796e;
      padding: 50px 10px;
      grid-column: 1 / -1;
    }

    @media (max-width: 650px) {
      .header-inner { padding: 10px 14px; gap: 10px; }
      .logo { width: 125px; height: 48px; }
      .search { font-size: 14px; padding: 10px 12px; }
      main { padding: 25px 14px 45px; }
      .recipes { grid-template-columns: 1fr; gap: 18px; }
      .card-image { height: 220px; }
      .modal-body { padding: 22px 20px 28px; }
      .modal h2 { font-size: 27px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <img class="logo" src="logo-pacomer.png" alt="Recetas PACOmer">
      <input id="search" class="search" type="search" placeholder="Buscar receta, ingrediente...">
    </div>
  </header>

  <main>
    <section class="intro">
      <h1>Recetas PACOmer</h1>
      <p>Recetas sencillas para cocinar y disfrutar.</p>
    </section>
    <section id="recipes" class="recipes">
      <div class="empty">Cargando recetas...</div>
    </section>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <article class="modal-content">
      <button class="close" id="close" aria-label="Cerrar">×</button>
      <img id="modalImage" class="modal-image" alt="">
      <div id="modalBody" class="modal-body"></div>
    </article>
  </div>

<script>
  const FALLBACK_IMAGE = "logo-pacomer.png";
  const IMAGE_PREFIX = "images/";

  const recipesContainer = document.getElementById("recipes");
  const searchInput = document.getElementById("search");
  const modal = document.getElementById("modal");
  const modalImage = document.getElementById("modalImage");
  const modalBody = document.getElementById("modalBody");
  const closeButton = document.getElementById("close");

  let recipes = [];

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function parseRecipes(markdown) {
    const blocks = markdown.split(/\n---+\n/);
    return blocks.map(block => {
      const title = (block.match(/^##\s+(.+)$/m) || [,""])[1].trim();
      if (!title) return null;

      const imageMatch = block.match(/^\*\*Imagen:\*\*\s*`?([^`\n]+)`?\s*$/m);
      const image = imageMatch ? imageMatch[1].trim() : null;

      const ingredientsMatch = block.match(/###\s+Ingredientes\s*\n([\s\S]*?)(?=\n###\s+Elaboración|\s*$)/i);
      const stepsMatch = block.match(/###\s+Elaboración\s*\n([\s\S]*?)(?=\n---+\s*$|\s*$)/i);

      const ingredients = ingredientsMatch
        ? [...ingredientsMatch[1].matchAll(/^\s*-\s+(.+)$/gm)].map(m => m[1].trim())
        : [];

      const steps = stepsMatch
        ? [...stepsMatch[1].matchAll(/^\s*\d+\.\s+(.+)$/gm)].map(m => m[1].trim())
        : [];

      return { title, image, ingredients, steps };
    }).filter(Boolean);
  }

  function resolveImage(recipe) {
    if (!recipe.image) return FALLBACK_IMAGE;
    const image = recipe.image.replace(/^["']|["']$/g, "");
    return image.startsWith("images/") ? image : IMAGE_PREFIX + image;
  }

  function render(filter = "") {
    const q = filter.trim().toLowerCase();
    const visible = recipes.filter(recipe => {
      if (!q) return true;
      return [
        recipe.title,
        ...recipe.ingredients,
        ...recipe.steps
      ].join(" ").toLowerCase().includes(q);
    });

    if (!visible.length) {
      recipesContainer.innerHTML = '<div class="empty">No se han encontrado recetas.</div>';
      return;
    }

    recipesContainer.innerHTML = visible.map((recipe, index) => `
      <article class="card" data-index="${recipes.indexOf(recipe)}">
        <img class="card-image"
             src="${escapeHtml(resolveImage(recipe))}"
             alt="${escapeHtml(recipe.title)}"
             onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'">
        <div class="card-body">
          <h2>${escapeHtml(recipe.title)}</h2>
          <div class="count">${recipe.ingredients.length} ingredientes</div>
        </div>
      </article>
    `).join("");

    document.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => openRecipe(Number(card.dataset.index)));
    });
  }

  function openRecipe(index) {
    const recipe = recipes[index];
    modalImage.src = resolveImage(recipe);
    modalImage.alt = recipe.title;
    modalImage.onerror = () => {
      modalImage.onerror = null;
      modalImage.src = FALLBACK_IMAGE;
    };

    modalBody.innerHTML = `
      <h2>${escapeHtml(recipe.title)}</h2>
      <h3>Ingredientes</h3>
      <ul>${recipe.ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>
      <h3>Elaboración</h3>
      <ol>${recipe.steps.map(s => `<li>${escapeHtml(s)}</li>`).join("")}</ol>
    `;

    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  closeButton.addEventListener("click", closeModal);
  modal.addEventListener("click", e => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });
  searchInput.addEventListener("input", e => render(e.target.value));

  fetch("recetas.md")
    .then(response => {
      if (!response.ok) throw new Error("No se pudo cargar recetas.md");
      return response.text();
    })
    .then(markdown => {
      recipes = parseRecipes(markdown);
      render();
    })
    .catch(error => {
      console.error(error);
      recipesContainer.innerHTML = `
        <div class="empty">
          No se han podido cargar las recetas.<br>
          Comprueba que <strong>recetas.md</strong> está en la raíz del repositorio.
        </div>`;
    });
</script>
</body>
</html>
