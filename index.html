<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recetas PACOmer</title>
<style>
:root{--bg:#f6f1e8;--paper:#fffdf9;--ink:#302b26;--muted:#756d64;--accent:#b95728;--soft:#f0d8c7;--line:#e4d9cc;--shadow:0 8px 25px rgba(60,45,30,.08)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#fffaf2,#f1e1d0);border-bottom:1px solid var(--line)}
.hero{max-width:1180px;margin:auto;padding:28px 22px 30px;text-align:center}.brand-logo{width:145px;height:145px;object-fit:contain}.brand-name{font:700 22px Georgia,serif;margin:4px 0}.sub{color:var(--muted);margin:0 auto 20px}.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fff;outline:0}
main{max-width:1180px;margin:auto;padding:25px 22px 55px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters button,.back{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;color:var(--ink);cursor:pointer}.filters button.active,.filters button:hover,.back:hover{background:var(--accent);border-color:var(--accent);color:#fff}.count{font-size:13px;color:var(--muted);margin:8px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px)}.card-img{width:100%;height:190px;object-fit:cover;background:#eee}.card-content{padding:18px}.card h2{font-size:22px;margin:5px 0 8px}.cat{color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.preview{color:var(--muted);font-size:14px;line-height:1.5}
.recipe{display:none;max-width:950px;margin:auto}.recipe.show{display:block}.back{margin-bottom:18px}.recipe-title h1{font:700 42px Georgia,serif;margin:8px 0}.recipe-image{width:100%;max-height:500px;object-fit:cover;border-radius:20px;margin:8px 0 25px;box-shadow:var(--shadow)}.body{display:grid;grid-template-columns:290px 1fr;gap:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:21px}.panel h2{font:700 22px Georgia,serif;margin-top:0}.ing{padding:9px 0;border-bottom:1px solid var(--line)}.ing:last-child{border-bottom:0}.steps{counter-reset:step}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;margin:0 0 18px;line-height:1.65}.num{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800}.empty{text-align:center;color:var(--muted);padding:50px}
@media(max-width:720px){.hero{padding:20px 16px 24px}.brand-logo{width:115px;height:115px}.recipe-title h1{font-size:33px}.body{grid-template-columns:1fr}main{padding:20px 16px 45px}.grid{grid-template-columns:1fr}.card-img{height:220px}}
</style>
</head>
<body>
<header><div class="hero"><img class="brand-logo" src="logo-pacomer.png" alt="Recetas PACOmer"><div class="brand-name">Recetas PACOmer</div><p class="sub">Tus recetas, ordenadas y listas para consultar.</p><input class="search" id="search" placeholder="Buscar receta, ingrediente o preparación…"></div></header>
<main>
<section id="listing"><div class="filters" id="filters"></div><div class="count" id="count"></div><div class="grid" id="grid"></div></section>
<section id="recipe" class="recipe"></section>
</main>
<script>
const MD_FILE='recetas.md';
let recipes=[]; let activeCategory='Todas';

function parseMarkdown(md){
  const blocks=md.split(/\n(?=## )/).filter(b=>b.trim().startsWith('## '));
  return blocks.map(block=>{
    const lines=block.split('\n');
    const name=lines[0].replace(/^##\s+/,'').trim();
    const imageLine=lines.find(x=>/^\*\*Imagen:\*\*/.test(x));
    const image=imageLine?imageLine.match(/`([^`]+)`/)?.[1]:null;
    const ingStart=lines.findIndex(x=>x.trim()==='### Ingredientes');
    const elStart=lines.findIndex(x=>x.trim()==='### Elaboración');
    const ingredients=ingStart>=0&&elStart>ingStart?lines.slice(ingStart+1,elStart).filter(x=>x.trim().startsWith('- ')).map(x=>x.replace(/^\s*-\s*/,'').trim()):[];
    const steps=elStart>=0?lines.slice(elStart+1).filter(x=>/^\s*\d+\.\s+/.test(x)).map(x=>x.replace(/^\s*\d+\.\s+/,'').trim()):[];
    return {name,image,ingredients,steps};
  });
}
function categories(){return ['Todas'];}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const list=recipes.filter(r=>{const hay=(r.name+' '+r.ingredients.join(' ')+' '+r.steps.join(' ')).toLowerCase();return !q||hay.includes(q)});
 document.getElementById('count').textContent=`${list.length} receta${list.length===1?'':'s'}`;
 document.getElementById('grid').innerHTML=list.length?list.map((r,i)=>`<article class="card" onclick="openRecipe(${recipes.indexOf(r)})">${r.image?`<img class="card-img" src="${esc(r.image)}" alt="${esc(r.name)}">`:''}<div class="card-content"><div class="cat">Receta</div><h2>${esc(r.name)}</h2><div class="preview">${esc(r.ingredients.slice(0,4).join(' · '))}</div></div></article>`).join(''):'<div class="empty">No se han encontrado recetas.</div>';
}
function openRecipe(i){
 const r=recipes[i];
 document.getElementById('listing').style.display='none'; const el=document.getElementById('recipe');el.classList.add('show');
 el.innerHTML=`<button class="back" onclick="closeRecipe()">← Volver a recetas</button><div class="recipe-title"><h1>${esc(r.name)}</h1></div>${r.image?`<img class="recipe-image" src="${esc(r.image)}" alt="${esc(r.name)}">`:''}<div class="body"><aside class="panel"><h2>Ingredientes</h2>${r.ingredients.map(x=>`<div class="ing">${esc(x)}</div>`).join('')}</aside><section class="panel"><h2>Elaboración</h2><div class="steps">${r.steps.map((x,n)=>`<div class="step"><div class="num">${n+1}</div><div>${esc(x)}</div></div>`).join('')}</div></section></div>`;
 history.pushState({recipe:i},'',`#receta-${i}`); window.scrollTo(0,0);
}
function closeRecipe(){document.getElementById('recipe').classList.remove('show');document.getElementById('listing').style.display='block';history.pushState({},'',location.pathname);window.scrollTo(0,0);}
async function init(){
 try{const md=await fetch(MD_FILE).then(r=>{if(!r.ok)throw new Error('No se pudo cargar recetas.md');return r.text()});recipes=parseMarkdown(md);render();}
 catch(e){document.getElementById('grid').innerHTML='<div class="empty">No se ha podido cargar <strong>recetas.md</strong>. Comprueba que está en la misma carpeta que index.html.</div>';console.error(e)}
}
document.getElementById('search').addEventListener('input',render);window.addEventListener('popstate',()=>{if(!location.hash)closeRecipe()});init();
</script>
</body></html>
